name: Regenerate README

on:
  push:
    branches: [main]
    paths:
      - companies.yml
      - scripts/companies.php
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: regenerate-readme
  cancel-in-progress: false

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none
      - run: composer install --no-interaction --no-progress --prefer-dist
      - run: php scripts/companies.php readme
      - name: Commit the regenerated table
        run: |
          if git diff --quiet -- README.md; then
            echo "README.md already matches companies.yml."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "Regenerate README companies table"
          git pull --rebase origin main
          git push origin HEAD:main
